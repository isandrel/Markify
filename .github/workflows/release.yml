name: Release to GitHub and Greasy Fork

on:
  push:
    tags:
      - "v*.*.*" # Triggers on version tags like v0.0.1, v1.2.3

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Validate and stage release artifacts
        run: |
          bun run validate
          bun run stage:release -- ${{ steps.version.outputs.VERSION }}
          cp packages/userscript/dist/markify-v${{ steps.version.outputs.VERSION }}.user.js "${RUNNER_TEMP}/markify-v${{ steps.version.outputs.VERSION }}.user.js"
          cp dist/markify.user.js "${RUNNER_TEMP}/markify.user.js"

      - name: Commit static file to main for Greasy Fork webhook
        run: |
          git fetch origin main
          git checkout main
          git pull origin main
          mkdir -p dist
          cp "${RUNNER_TEMP}/markify.user.js" dist/markify.user.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/markify.user.js
          git commit -m "🤖 chore: update dist/markify.user.js for v${{ steps.version.outputs.VERSION }}" || echo "No changes"
          git push origin main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Markify v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: ${{ runner.temp }}/markify-v${{ steps.version.outputs.VERSION }}.user.js
          body: |
            ## 🚀 Markify ${{ steps.version.outputs.VERSION }}

            **Install:** [Click here](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/markify-v${{ steps.version.outputs.VERSION }}.user.js)

            ### Changes
            See commit history for details.

            ---

            **Greasy Fork:** This release is automatically synced to Greasy Fork
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify success
        run: |
          echo "✅ Release created successfully!"
          echo "📦 Userscript: packages/userscript/dist/markify-v${{ steps.version.outputs.VERSION }}.user.js"
          echo "🔗 Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          echo "🌐 Greasy Fork will sync from: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/markify-v${{ steps.version.outputs.VERSION }}.user.js"
