schema_version = 1
engine = "discourse-raw"
transport = "fetch"
page_separator = "\n\n---\n\n"

[site]
id = "uscardforum"
name = "US Card Forum"
base_url = "https://www.uscardforum.com"
origins = ["https://www.uscardforum.com"]
aliases = ["USCardForum"]

[activation]
matches = ["https://www.uscardforum.com/*"]
connect = ["self"]

[[routes]]
name = "thread"
kind = "thread"
pattern = '^/t/(?:[^/]+/)?(\d+)(?:/\d+)?/?$'
id_group = 1

[[routes]]
name = "category"
kind = "listing"
pattern = '^/c/([^/]+)(?:/[^/]+)*/?$'
id_group = 1
query_keys = ["page", "order", "ascending", "status", "q"]

[[routes]]
name = "tag"
kind = "listing"
pattern = '^/tags?/([^/]+)/?$'
id_group = 1
query_keys = ["page", "order", "ascending"]

[[routes]]
name = "search"
kind = "listing"
pattern = '^/search/?$'
query_keys = ["q", "page", "expanded"]

[[routes]]
name = "latest"
kind = "listing"
pattern = '^/(latest|new|top|hot)/?$'
id_group = 1
query_keys = ["order", "ascending", "period", "page"]

[[routes]]
name = "home"
kind = "entry"
pattern = '^/(?:categories)?/?$'

[runtime]
poll_ms = 500
debounce_ms = 100
timeout_ms = 30000

[batch]
label_selector = "h1"

[[batch.layouts]]
name = "topic-list"
route_names = ["category", "tag", "latest"]
root_selector = "#main-outlet"
row_selector = "tr.topic-list-item"
link_selector = 'a.title[href*="/t/"], a.raw-topic-link[href*="/t/"]'
exclude_selectors = ["aside"]

[[batch.layouts]]
name = "search-results"
route_names = ["search"]
root_selector = "#main-outlet"
row_selector = ".fps-result"
link_selector = 'a.search-link[href*="/t/"]'
title_selector = ".topic-title"
exclude_selectors = ["aside"]

[api]
# Primary: raw Markdown endpoint (returns plain text Markdown)
# Placeholders: {base_url}, {topic_id}, {page}
raw_endpoint  = "{base_url}/raw/{topic_id}?page={page}"

# Fallback: JSON API (returns structured data with cooked HTML)
# Append ?print=true to get up to 1000 posts in one request
json_endpoint = "{base_url}/t/{topic_id}.json?print=true&include_raw=true"

# Pagination
max_pages      = 100              # Safety limit for paginated fetching
page_delay = { min_ms = 100, max_ms = 100, jitter = 0 }

# Request configuration
[api.request]
credentials = true                # Send cookies for auth
accept      = "text/plain"        # Accept header for raw endpoint

# How to extract the topic ID from a URL
[api.id_extraction]
# Each pattern is tried in order; first capturing group is the ID
patterns = [
    '/t/[^/]+/(\d+)',             # /t/{slug}/{id}
    '/t/(\d+)',                   # /t/{id}
]

# ─── Metadata Configuration ──────────────────────────────────────────
# How to extract metadata from the page (for frontmatter)

[metadata]
# The topic title element; Discourse's page title is "Topic - Category - Site".
title_selectors = ["#topic-title .fancy-title", "#topic-title h1"]

# Fallback: regex to clean the page title (removes site name suffix)
title_cleanup = '[\s\-]+(美国信用卡指南|US Card Forum)$'

# Default tags
tags = ["uscardforum", "forum", "credit-cards"]

# Source URL template (canonical URL for frontmatter)
source_url = "{base_url}/t/{topic_id}"

# ─── Page separator ──────────────────────────────────────────────────


# ─── Filename Templates ──────────────────────────────────────────────
[filename]
single     = "{title}"
batch_item = "{id} - {title}"
batch      = "{site}-{type}-{tagname}-{date}"
