# US Card Forum Adapter Configuration
# Platform: Discourse (https://docs.discourse.org)

[site]
name     = "US Card Forum"
base_url = "https://www.uscardforum.com"

# URL patterns that trigger this adapter
url_patterns = [
    "https://www.uscardforum.com/t/*/*",
]

# ─── API Configuration ───────────────────────────────────────────────
# Discourse provides a JSON API for all its content.
# We prefer the /raw/ endpoint for Markdown, with .json as fallback.

[api]
# Primary: raw Markdown endpoint (returns plain text Markdown)
# Placeholders: {base_url}, {topic_id}, {page}
raw_endpoint  = "{base_url}/raw/{topic_id}?page={page}"

# Fallback: JSON API (returns structured data with cooked HTML)
# Append ?print=true to get up to 1000 posts in one request
json_endpoint = "{base_url}/t/{topic_id}.json?print=true&include_raw=true"

# Pagination
max_pages      = 100              # Safety limit for paginated fetching
page_delay_ms  = 100              # Delay between page requests (rate limit)

# Request configuration
[api.request]
credentials = true                # Send cookies for auth
accept      = "text/plain"        # Accept header for raw endpoint

# How to extract the topic ID from a URL
[api.id_extraction]
# Each pattern is tried in order; first capturing group is the ID
patterns = [
    '/t/[^/]+/(\d+)',             # /t/{slug}/{id}
    '/t/(\d+)',                   # /t/{id}
]

# ─── Metadata Configuration ──────────────────────────────────────────
# How to extract metadata from the page (for frontmatter)

[metadata]
# Regex to clean the page title (removes site name suffix)
title_cleanup = '[\s\-]+(美国信用卡指南|US Card Forum)$'

# Default tags
tags = ["uscardforum", "forum", "credit-cards"]

# Source URL template (canonical URL for frontmatter)
source_url = "{base_url}/t/{topic_id}"

# ─── Page separator ──────────────────────────────────────────────────
page_separator = "\n\n---\n\n"

# ─── Batch Download Configuration ────────────────────────────────────
# (Used by @markify/userscript only)

[batch]
listing_patterns = ["/c/", "/search", "/tag/", "/tags/"]
exclude_pattern  = "/t/"

[batch.selectors]
topic_links  = 'a.title[href*="/t/"], a[href*="/t/"].raw-topic-link'
search_links = 'a.search-link[href*="/t/"]'
search_title = '.topic-title > span'

[batch.selectors.containers]
search_result = ".fps-result"
topic_row     = "tr.topic-list-item"
generic       = ".topic-list-item, .ember-view"

[batch.patterns]
topic_id = '/t/[^/]+/(\d+)'
category = '/c/([^/]+)'
tag      = '/tag[s]?/([^/]+)'

[batch.types]
category = "category"
listing  = "listing"
search   = "search"
tag      = "tag"

# ─── Filename Templates ──────────────────────────────────────────────
[filename]
single     = "{title}"
batch_item = "{id} - {title}"
batch      = "{site}-{type}-{tagname}-{date}"
