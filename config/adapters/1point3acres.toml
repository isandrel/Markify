# Validated site profile. Selectors and route changes belong here.
schema_version = 1
engine = "forum-json"
transport = "gm"
delimiter = "---"

[site]
id = "1point3acres"
name = "1Point3Acres"
base_url = "https://www.1point3acres.com"
origins = ["https://www.1point3acres.com", "https://instant.1point3acres.com"]
aliases = ["1point3acres"]

[activation]
matches = ["https://www.1point3acres.com/home/*", "https://www.1point3acres.com/bbs/thread-*", "https://instant.1point3acres.com/thread/*"]
connect = ["api.1point3acres.com"]

[[routes]]
name = "discover"
kind = "listing"
pattern = '^/home/discover/([^/]+)/?$'
id_group = 1
origins = ["https://www.1point3acres.com"]
query_keys = ["page", "sort", "order", "tab", "type"]

[[routes]]
name = "forum"
kind = "listing"
pattern = '^/home/forum/([^/]+)/?$'
id_group = 1
origins = ["https://www.1point3acres.com"]
query_keys = ["page", "sort", "order", "tab", "type"]

[[routes]]
name = "tag"
kind = "listing"
pattern = '^/home/tag/([^/]+)/?$'
id_group = 1
origins = ["https://www.1point3acres.com"]
query_keys = ["page", "sort", "order", "tab", "type"]

[[routes]]
name = "thread"
kind = "thread"
pattern = '^/home/thread/(\d+)/?$'
id_group = 1
origins = ["https://www.1point3acres.com"]

[[routes]]
name = "pins"
kind = "thread"
pattern = '^/home/pins/(\d+)/?$'
id_group = 1
origins = ["https://www.1point3acres.com"]

[[routes]]
name = "bbs-thread"
kind = "thread"
pattern = '^/bbs/thread-(\d+)-\d+-\d+\.html$'
id_group = 1
origins = ["https://www.1point3acres.com"]

[[routes]]
name = "instant-thread"
kind = "thread"
pattern = '^/thread/(\d+)/?$'
id_group = 1
origins = ["https://instant.1point3acres.com"]

[[routes]]
name = "home"
kind = "entry"
pattern = '^/home/?$'
origins = ["https://www.1point3acres.com"]

[runtime]
poll_ms = 500
debounce_ms = 100
timeout_ms = 30000

[batch]
label_selector = "main h1"

[[batch.layouts]]
name = "forum-thread-items"
route_names = ["discover", "forum", "tag"]
root_selector = "main"
row_selector = '[data-sentry-component="ForumThreadItem"]'
link_selector = 'a[href*="/home/thread/"]:has(h3), a[href*="/home/pins/"]:has(h3)'
title_selector = "h3"
title_attribute = "title"
exclude_selectors = ["aside", "[data-ad]"]

[[batch.layouts]]
name = "legacy-home-thread-items"
route_names = ["forum", "tag"]
root_selector = "main"
row_selector = '[data-sentry-component="HomeThreadItem"]'
link_selector = 'a[href*="/home/pins/"]'
title_selector = "h3"
exclude_selectors = ["aside", "[data-ad]"]

[api]
# Thread data endpoint
# Placeholders: {thread_id}
thread_endpoint  = "https://api.1point3acres.com/api/v3/home-threads/{thread_id}"

# Comments/posts endpoint (paginated)
# Placeholders: {thread_id}, {page_size}, {order}, {page}
posts_endpoint   = "https://api.1point3acres.com/api/threads/{thread_id}/nested-posts?ps={page_size}&order={order}&pg={page}"

# Full nested replies (楼中楼) of one post; the comments page only carries a preview.
# Needs a logged-in session; without one the export notes how many replies are missing.
# Placeholders: {post_id}, {page_size}, {page}
nested_endpoint  = "https://api.1point3acres.com/api/posts/{post_id}/nested-posts?ps={page_size}&pg={page}"

# Pagination
max_pages  = 100                 # Safety limit
page_size  = 20                  # Comments per page (ps parameter)
order      = "time_asc"          # Sort: "time_asc", "time_desc", "hot_desc"

# Content format
content_format = "bbcode"        # Thread content is in BBCode

# Success check — JSON response field validation
[api.response]
success_field = "errno"          # Field name to check
success_value = 0                # Expected value for success
posts_field   = "posts"
data_field    = "thread"         # Field containing the thread data

# How to extract the thread ID from a URL
[api.id_extraction]
patterns = [
    'thread-(\d+)',              # /bbs/thread-{id}-1-1.html
    '/pins/(\d+)',               # /home/pins/{id}
    '/thread/(\d+)',             # instant.1point3acres.com/thread/{id}
]

# ─── Response Field Mapping ──────────────────────────────────────────
# Maps API response fields to internal variable names used in templates
# Format: internal_name = "api_response_field"

[api.fields]
title      = "subject"
author     = "author"
content    = "message_bbcode"
posted_at  = "dateline"          # Unix timestamp
updated_at = "lastpost"          # Unix timestamp
views      = "views"
replies    = "replies"
favorites  = "favtimes"

# Post/comment field mapping
[api.fields.post]
id         = "pid"
author     = "author"
content    = "message_bbcode"
posted_at  = "dateline"          # Unix timestamp
children       = "replies.data"   # Nested reply preview (first few)
children_count = "replies.count"  # Total nested replies of the post

# ─── Metadata Configuration ──────────────────────────────────────────

[metadata]
tags       = ["1point3acres", "forum"]
source_url = "https://www.1point3acres.com/bbs/thread-{thread_id}-1-1.html"

# ─── Templates ────────────────────────────────────────────────────────
# These templates define how the API data is assembled into final Markdown

# Section delimiter


# YAML frontmatter template
# Variables: {title}, {author}, {posted_at}, {updated_at}, {downloaded_at},
#            {url}, {views}, {replies}, {favorites}
[frontmatter]
template = """---
title: "{title}"
author: {author}
posted_at: {posted_at}
updated_at: {updated_at}
downloaded_at: {downloaded_at}
source: {url}
views: {views}
replies: {replies}
favorites: {favorites}
tags:
  - 1point3acres
  - forum
---
"""

# Complete Markdown layout
# Variables: {frontmatter}, {title}, {author}, {date}, {content},
#            {views}, {replies}, {favorites}, {comments}
[document]
template = """{frontmatter}
# {title}

**Author:** {author} | **Date:** {date}

---

{content}

---

**Views:** {views} | **Replies:** {replies} | **Favorites:** {favorites}

{comments}"""

# Individual comment template (builds {comments} variable)
# Variables: {author}, {date}, {content}, {index}, {delimiter},
#            {nested} (its nested replies, rendered with [reply] and [replies_gap])
[comment]
template = """
**{author}** - *{date}*

{content}

{nested}{delimiter}
"""

# One nested reply. {content} is already quoted ("> " on every line).
[reply]
template = """> **{author}** - *{date}*
>
{content}
"""

# Shown under a post when some of its nested replies could not be fetched.
# Variables: {missing}, {reason}
[replies_gap]
template = """> *{missing} more replies are not included ({reason}).*
"""

# Comments section header (prepended to all comments)
# Variables: {count}, {delimiter}
[comments_header]
template = """

{delimiter}

## Comments ({count})
"""

# ─── Filename Templates ──────────────────────────────────────────────
[filename]
single     = "{title}"
batch_item = "{id} - {title}"
batch      = "{site}-{type}-{tagname}-{date}"
