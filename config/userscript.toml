# Userscript configuration
[userscript]
homepageURL = "https://github.com/isandrel/Markify"
icon = "https://cdn.jsdelivr.net/npm/@tabler/icons@latest/icons/download.svg"
license = "AGPL-3.0-or-later"
# Site activation patterns are generated from validated adapter profiles.
match = []
namespace = "https://github.com/isandrel/Markify"
supportURL = "https://github.com/isandrel/Markify/issues"

[userscript.grant]
permissions = [
    "GM.deleteValue",
    "GM.getValue",
    "GM.listValues",
    "GM.notification",
    "GM.openInTab",
    "GM.registerMenuCommand",
    "GM.setClipboard",
    "GM.setValue",
    "GM.xmlHttpRequest",
    # window.markify, the token-gated AI console API (off until enabled per site from the menu).
    "unsafeWindow",
]

[userscript.compatible]
browsers = ["chrome", "edge", "firefox", "opera", "safari"]
